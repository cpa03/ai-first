name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

env:
  NODE_VERSION: '20'
  NPM_VERSION: '9'

jobs:
  # =============================================================================
  # PR SIZE CHECK
  # =============================================================================
  pr-size:
    name: PR Size Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate PR size
        id: pr-size
        run: |
          # Get base and head commits
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          
          # Count changes
          CHANGES=$(git diff --shortstat $BASE_SHA..$HEAD_SHA)
          echo "changes=$CHANGES" >> $GITHUB_OUTPUT
          
          # Get file count
          FILE_COUNT=$(git diff --name-only $BASE_SHA..$HEAD_SHA | wc -l)
          echo "file_count=$FILE_COUNT" >> $GITHUB_OUTPUT
          
          # Get lines added/removed
          LINES_ADDED=$(git diff --numstat $BASE_SHA..$HEAD_SHA | awk '{sum+=$1} END {print sum}')
          LINES_REMOVED=$(git diff --numstat $BASE_SHA..$HEAD_SHA | awk '{sum+=$2} END {print sum}')
          echo "lines_added=${LINES_ADDED:-0}" >> $GITHUB_OUTPUT
          echo "lines_removed=${LINES_REMOVED:-0}" >> $GITHUB_OUTPUT
          
          # Calculate total lines changed
          TOTAL_LINES=$(( ${LINES_ADDED:-0} + ${LINES_REMOVED:-0} ))
          echo "total_lines=$TOTAL_LINES" >> $GITHUB_OUTPUT

      - name: Comment PR size
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes('PR Size'));
            const body = `📊 **PR Size Analysis**\n\n\`\`\`\n${{ steps.pr-size.outputs.changes }}\n\`\`\`\n\n- **Files changed**: ${{ steps.pr-size.outputs.file_count }}\n- **Lines added**: ${{ steps.pr-size.outputs.lines_added }}\n- **Lines removed**: ${{ steps.pr-size.outputs.lines_removed }}\n- **Total lines**: ${{ steps.pr-size.outputs.total_lines }}\n\n---\n*Size categories: XS (<10 lines), S (10-50), M (50-200), L (200-500), XL (>500)*`;
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Warn on large PRs
        if: ${{ steps.pr-size.outputs.total_lines > 500 }}
        run: |
          echo "::warning::PR is XL size (>500 lines). Consider breaking into smaller PRs."

  # =============================================================================
  # LABEL VALIDATION
  # =============================================================================
  label-check:
    name: Label Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate required labels
        uses: actions/github-script@v7
        with:
          script: |
            const requiredLabels = ['type:', 'size:'];
            const optionalLabels = ['priority:', 'area:', 'status:'];
            const prLabels = context.payload.pull_request.labels.map(l => l.name);
            
            const hasType = prLabels.some(l => l.startsWith('type:'));
            const hasSize = prLabels.some(l => l.startsWith('size:'));
            
            const missing = [];
            if (!hasType) missing.push('type:* (e.g., type:feature, type:bugfix, type:refactor)');
            if (!hasSize) missing.push('size:* (e.g., size:xs, size:s, size:m, size:l, size:xl)');
            
            if (missing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `⚠️ **Missing Required Labels**\n\nPlease add the following labels:\n${missing.map(m => `- ${m}`).join('\n')}\n\nAvailable labels:\n- **type:** feature, bugfix, refactor, docs, chore, test, security, perf\n- **size:** xs, s, m, l, xl\n- **priority:** high, medium, low\n- **area:** frontend, backend, api, database, devops, security, ui, infra\n- **status:** ready, wip, blocked, needs-review`
              });
              core.setFailed(`Missing required labels: ${missing.join(', ')}`);
            } else {
              console.log('✅ All required labels present');
            }

  # =============================================================================
  # AUTO-REVIEW ASSIGNMENT
  # =============================================================================
  auto-reviewers:
    name: Auto-Review Assignment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assign reviewers based on changed files
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            // Define reviewer mapping based on file paths
            const reviewerMap = {
              'src/app/': ['frontend-team'],
              'src/lib/': ['backend-team'],
              'src/components/': ['frontend-team', 'ui-team'],
              'supabase/': ['database-team'],
              '.github/workflows/': ['devops-team'],
              'scripts/': ['devops-team'],
              'docs/': ['docs-team'],
              'tests/': ['qa-team'],
              'public/': ['frontend-team'],
            };
            
            const reviewers = new Set();
            const teams = new Set();
            
            for (const file of files) {
              for (const [path, teamReviewers] of Object.entries(reviewerMap)) {
                if (file.filename.startsWith(path)) {
                  teamReviewers.forEach(t => teams.add(t));
                }
              }
            }
            
            // Get team members (in real scenario, fetch from GitHub API)
            // For now, just request review from teams
            const teamList = Array.from(teams);
            
            if (teamList.length > 0) {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                team_reviewers: teamList
              });
              console.log(`✅ Requested review from teams: ${teamList.join(', ')}`);
            }

  # =============================================================================
  # QUICK CHECKS (Lightweight)
  # =============================================================================
  quick-checks:
    name: Quick Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run type-check
        run: npm run type-check

      - name: Run tests (changed files only)
        run: npm run test:changed

  # =============================================================================
  # FULL CHECKS (On main branch or labeled 'needs-full-check')
  # =============================================================================
  full-checks:
    name: Full Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.pull_request.base.ref == 'main' || contains(github.event.pull_request.labels.*.name, 'needs-full-check')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security check
        run: npm run security:check

      - name: Run npm audit
        run: npm run audit:ci

      - name: Build for production
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COST_LIMIT_DAILY: ${{ secrets.COST_LIMIT_DAILY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

      - name: Build for Cloudflare
        run: npm run build:cloudflare
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COST_LIMIT_DAILY: ${{ secrets.COST_LIMIT_DAILY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

      - name: Validate environment
        run: npm run env:check -- --ci

      - name: Run console scan (BroCula)
        run: |
          npx playwright install --with-deps chromium
          npm run scan:console

      - name: Run Lighthouse audit
        run: |
          sudo apt-get update && sudo apt-get install -y google-chrome-stable
          npm run audit:lighthouse

  # =============================================================================
  # DEPENDENCY CHECK
  # =============================================================================
  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for outdated dependencies
        run: npm outdated || true

      - name: Check for circular dependencies
        run: npm run check:circular

      - name: Validate user stories (if changed)
        if: github.event_name == 'pull_request'
        run: |
          CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})
          if echo "$CHANGED_FILES" | grep -q "docs/user-stories\|docs/tasks"; then
            npm run user-stories:validate
          else
            echo "No user story changes, skipping validation"
          fi

  # =============================================================================
  # DOCS LINK CHECK
  # =============================================================================
  docs-links:
    name: Documentation Links Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check documentation links
        run: npm run docs:check-links

  # =============================================================================
  # AUTO-MERGE CHECK
  # =============================================================================
  auto-merge:
    name: Auto-Merge Eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [pr-size, label-check, quick-checks, full-checks, dependency-check, docs-links]
    if: always()
    steps:
      - name: Check if PR is eligible for auto-merge
        uses: actions/github-script@v7
        with:
          script: |
            const requiredChecks = ['pr-size', 'label-check', 'quick-checks', 'dependency-check', 'docs-links'];
            const isMain = context.payload.pull_request.base.ref === 'main';
            
            // Check if all required checks passed
            let allPassed = true;
            for (const check of requiredChecks) {
              const result = needs[check]?.result;
              if (result !== 'success') {
                allPassed = false;
                console.log(`❌ ${check}: ${result}`);
              } else {
                console.log(`✅ ${check}: passed`);
              }
            }
            
            // Check for full checks if targeting main
            if (isMain) {
              const fullResult = needs['full-checks']?.result;
              if (fullResult !== 'success') {
                allPassed = false;
                console.log(`❌ full-checks: ${fullResult} (required for main)`);
              }
            }
            
            // Check for auto-merge label
            const prLabels = context.payload.pull_request.labels.map(l => l.name);
            const hasAutoMerge = prLabels.includes('auto-merge');
            
            if (allPassed && hasAutoMerge) {
              console.log('🎉 PR is eligible for auto-merge!');
              // Enable auto-merge
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                auto_merge: true
              });
            } else if (hasAutoMerge && !allPassed) {
              console.log('⏳ Auto-merge label present but checks not passing');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '⏳ **Auto-merge pending**: All checks must pass before auto-merge can proceed.'
              });
            }

  # =============================================================================
  # SUMMARY
  # =============================================================================
  summary:
    name: PR Checks Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - pr-size
      - label-check
      - auto-reviewers
      - quick-checks
      - full-checks
      - dependency-check
      - docs-links
      - auto-merge
    if: always()
    steps:
      - name: Print summary
        run: |
          echo "=== PR Checks Summary ==="
          echo "PR Size: ${{ needs.pr-size.result }}"
          echo "Label Check: ${{ needs.label-check.result }}"
          echo "Auto Reviewers: ${{ needs.auto-reviewers.result }}"
          echo "Quick Checks: ${{ needs.quick-checks.result }}"
          echo "Full Checks: ${{ needs.full-checks.result }}"
          echo "Dependency Check: ${{ needs.dependency-check.result }}"
          echo "Docs Links: ${{ needs.docs-links.result }}"
          echo "Auto-Merge: ${{ needs.auto-merge.result }}"
          
          # Determine overall status
          REQUIRED_JOBS=("pr-size" "label-check" "quick-checks" "dependency-check" "docs-links")
          FAILED=0
          
          for job in "${REQUIRED_JOBS[@]}"; do
            RESULT="${{ needs.$job.result }}"
            if [[ "$RESULT" != "success" ]]; then
              echo "❌ Required job $job failed: $RESULT"
              FAILED=1
            fi
          done
          
          # Full checks required for main branch
          if [[ "${{ github.event.pull_request.base.ref }}" == "main" ]]; then
            FULL_RESULT="${{ needs.full-checks.result }}"
            if [[ "$FULL_RESULT" != "success" ]]; then
              echo "❌ Full checks required for main branch: $FULL_RESULT"
              FAILED=1
            fi
          fi
          
          if [[ $FAILED -eq 1 ]]; then
            echo "❌ Some required checks failed"
            exit 1
          else
            echo "✅ All required checks passed"
          fi