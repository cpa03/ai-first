name: Iterate - Main CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run every 4 hours for proactive issue detection
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      agent:
        description: 'Specific agent to run (repo-keeper, pallet, flexy, broc)'
        required: false
        type: string

env:
  NODE_VERSION: '20'
  NPM_VERSION: '9'

jobs:
  # =============================================================================
  # QUALITY CHECKS (lint, type-check, test)
  # =============================================================================
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run type-check
        run: npm run type-check

      - name: Run tests (CI mode)
        run: npm run test:ci

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  # =============================================================================
  # SECURITY SCAN
  # =============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security check script
        run: npm run security:check

      - name: Run npm audit
        run: npm run audit:ci

  # =============================================================================
  # BUILD CHECKS
  # =============================================================================
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality, security]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for production (Next.js)
        run: npm run build

      - name: Build for Cloudflare
        run: npm run build:cloudflare

      - name: Verify build outputs exist
        run: |
          test -d .next && echo "✅ .next exists"
          test -d .open-next && echo "✅ .open-next exists"
          test -f .open-next/worker.js && echo "✅ worker.js exists"

  # =============================================================================
  # ENVIRONMENT VALIDATION
  # =============================================================================
  env-validation:
    name: Environment Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate environment (CI mode)
        run: npm run env:check -- --ci

  # =============================================================================
  # CONSOLE SCAN (BroCula)
  # =============================================================================
  console-scan:
    name: Console Scan (BroCula)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run console scan
        run: npm run scan:console

  # =============================================================================
  # LIGHTHOUSE AUDIT
  # =============================================================================
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Run Lighthouse audit
        run: npm run audit:lighthouse

  # =============================================================================
  # PARALLEL CHECK (Superpowers)
  # =============================================================================
  parallel-check:
    name: Parallel Quality Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality, security, build, env-validation]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run parallel check
        run: npm run check:parallel

  # =============================================================================
  # AGENT EXECUTION (OhMyOpenCode)
  # =============================================================================
  repo-keeper:
    name: RepoKeeper - Strategy & Triage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [quality, security, build, env-validation]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run RepoKeeper agent
        run: |
          npx oh-my-opencode agent RepoKeeper \
            --task "Analyze repository health, triage issues, create maintenance plan" \
            --output-format json

  pallet:
    name: Pallet - UX Improvements
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [quality, security, build, env-validation]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Pallet agent
        run: |
          npx oh-my-opencode agent Pallet \
            --task "Identify and implement UX improvements" \
            --output-format json

  flexy:
    name: Flexy - Modularity Improvements
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [quality, security, build, env-validation]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Flexy agent
        run: |
          npx oh-my-opencode agent Flexy \
            --task "Identify and improve modularity, reduce coupling" \
            --output-format json

  broc:
    name: Broc - Browser Console Fixes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [quality, security, build, env-validation, console-scan]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Broc agent
        run: |
          npx oh-my-opencode agent Broc \
            --task "Fix browser console errors and warnings" \
            --output-format json

  # =============================================================================
  # SUMMARY
  # =============================================================================
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - quality
      - security
      - build
      - env-validation
      - console-scan
      - lighthouse
      - parallel-check
      - repo-keeper
      - pallet
      - flexy
      - broc
    if: always()
    steps:
      - name: Print workflow summary
        run: |
          echo "=== Iterate CI Pipeline Summary ==="
          echo "Quality: ${{ needs.quality.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Env Validation: ${{ needs.env-validation.result }}"
          echo "Console Scan: ${{ needs.console-scan.result }}"
          echo "Lighthouse: ${{ needs.lighthouse.result }}"
          echo "Parallel Check: ${{ needs.parallel-check.result }}"
          echo "RepoKeeper: ${{ needs.repo-keeper.result }}"
          echo "Pallet: ${{ needs.pallet.result }}"
          echo "Flexy: ${{ needs.flexy.result }}"
          echo "Broc: ${{ needs.broc.result }}"

          # Fail if any required job failed
          if [[ "${{ needs.quality.result }}" != "success" ]] || \
             [[ "${{ needs.security.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.env-validation.result }}" != "success" ]]; then
            echo "❌ Required checks failed"
            exit 1
          fi

          echo "✅ All required checks passed"