# Automated Backup Workflow Template
# 
# This file contains the GitHub Actions workflow for automated backups.
# Due to repository permissions, this file needs to be added manually.
#
# Instructions:
# 1. Copy this file to .github/workflows/backup.yml
# 2. Add the required secrets to your repository:
#    - SUPABASE_URL: Your Supabase project URL
#    - SUPABASE_SERVICE_ROLE_KEY: Your Supabase service role key
# 3. The workflow will run automatically at 2 AM UTC daily
# 4. You can also trigger it manually from the Actions tab

name: Automated Backup

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      retention_days:
        description: 'Number of days to retain backups'
        required: false
        default: '30'
      verify_backup:
        description: 'Run verification after backup'
        required: false
        default: 'true'
        type: boolean

env:
  BACKUP_DIR: ./backups
  RETENTION_DAYS: ${{ github.event.inputs.retention_days || '30' }}

jobs:
  backup:
    name: Database Backup
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Validate environment
        run: |
          if [[ -z "${{ secrets.SUPABASE_URL }}" ]]; then
            echo "ERROR: SUPABASE_URL secret not configured"
            exit 1
          fi
          if [[ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]]; then
            echo "ERROR: SUPABASE_SERVICE_ROLE_KEY secret not configured"
            exit 1
          fi

      - name: Create backup directory
        run: mkdir -p ${{ env.BACKUP_DIR }}

      - name: Run database backup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          chmod +x ./scripts/backup.sh
          ./scripts/backup.sh \
            --output-dir ${{ env.BACKUP_DIR }} \
            --retention ${{ env.RETENTION_DAYS }} \
            --verify

      - name: Verify backup integrity
        if: ${{ github.event.inputs.verify_backup != 'false' }}
        run: |
          # Find the latest backup
          LATEST_BACKUP=$(ls -t ${{ env.BACKUP_DIR }}/ideaflow_backup_*.tar.gz 2>/dev/null | head -1)
          
          if [[ -n "$LATEST_BACKUP" ]]; then
            echo "Verifying backup: $LATEST_BACKUP"
            chmod +x ./scripts/backup-verify.sh
            ./scripts/backup-verify.sh --backup "$LATEST_BACKUP" --test-restore
          else
            echo "WARNING: No backup found to verify"
            exit 1
          fi

      - name: Generate backup report
        if: always()
        run: |
          chmod +x ./scripts/backup-monitor.sh
          ./scripts/backup-monitor.sh --report || true

      - name: Upload backup artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: |
            ${{ env.BACKUP_DIR }}/ideaflow_backup_*.tar.gz
            ${{ env.BACKUP_DIR }}/ideaflow_backup_*_metadata.json
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: warn

      - name: Cleanup old artifacts
        if: always()
        run: |
          # Clean up local backup files older than retention period
          find ${{ env.BACKUP_DIR }} -name "ideaflow_backup_*" -type f -mtime +${{ env.RETENTION_DAYS }} -delete 2>/dev/null || true
          
          # List remaining backups
          echo "Remaining backups:"
          ls -lh ${{ env.BACKUP_DIR }}/ideaflow_backup_*.tar.gz 2>/dev/null || echo "No backups found"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Backup workflow failed. Please check the logs and verify backup integrity."
          # Add your notification logic here (Slack, email, etc.)

  verify-latest:
    name: Verify Latest Backup
    runs-on: ubuntu-latest
    needs: backup
    if: ${{ github.event.inputs.verify_backup != 'false' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download backup artifact
        uses: actions/download-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: ./backups

      - name: Verify backup can be restored
        run: |
          chmod +x ./scripts/backup-verify.sh
          
          # Find the backup file
          BACKUP_FILE=$(find ./backups -name "ideaflow_backup_*.tar.gz" -type f | head -1)
          
          if [[ -n "$BACKUP_FILE" ]]; then
            echo "Verifying backup: $BACKUP_FILE"
            ./scripts/backup-verify.sh --backup "$BACKUP_FILE" --test-restore
          else
            echo "ERROR: No backup file found"
            exit 1
          fi

  cleanup:
    name: Cleanup Old Backups
    runs-on: ubuntu-latest
    needs: backup
    if: success()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cleanup old backup artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const retentionDays = parseInt('${{ env.RETENTION_DAYS }}') || 30;
            const cutoffDate = new Date();
            cutoffDate.setDate(cutoffDate.getDate() - retentionDays);
            
            console.log(`Cleaning up artifacts older than ${retentionDays} days (before ${cutoffDate.toISOString()})`);
            
            // List artifacts to clean up
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            
            for (const artifact of artifacts.data.artifacts) {
              const createdDate = new Date(artifact.created_at);
              if (createdDate < cutoffDate && artifact.name.startsWith('backup-')) {
                console.log(`Deleting old artifact: ${artifact.name} (created: ${artifact.created_at})`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id
                });
              }
            }
