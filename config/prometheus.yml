# =============================================================================
# Prometheus Configuration for IdeaFlow
# =============================================================================
# This config scrapes metrics from the IdeaFlow application
# Deploy alongside Prometheus server or use with Prometheus Operator
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'ideaflow'
    environment: 'production'

scrape_configs:
  # ---------------------------------------------------------------------------
  # IdeaFlow Application Metrics
  # ---------------------------------------------------------------------------
  - job_name: 'ideaflow-app'
    metrics_path: '/api/metrics'
    scheme: 'https'
    static_configs:
      - targets: ['your-domain.com']
        labels:
          service: 'ideaflow'
          component: 'web'
    # For local development:
    # - targets: ['host.docker.internal:3000']
    #   labels:
    #     service: 'ideaflow'
    #     component: 'web'
    #     environment: 'development'

  # ---------------------------------------------------------------------------
  # Cloudflare Workers Metrics (via Cloudflare Workers Exporter)
  # ---------------------------------------------------------------------------
  - job_name: 'cloudflare-workers'
    metrics_path: '/metrics'
    scheme: 'https'
    static_configs:
      - targets: ['workers-exporter.your-domain.com']
        labels:
          service: 'cloudflare'
          component: 'workers'

  # ---------------------------------------------------------------------------
  # Supabase Metrics (via Supabase Prometheus Exporter)
  # ---------------------------------------------------------------------------
  - job_name: 'supabase'
    metrics_path: '/metrics'
    scheme: 'https'
    static_configs:
      - targets: ['supabase-exporter.your-domain.com']
        labels:
          service: 'supabase'
          component: 'database'

  # ---------------------------------------------------------------------------
  # Node Exporter (Host-level metrics)
  # ---------------------------------------------------------------------------
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'infrastructure'
          component: 'host'

  # ---------------------------------------------------------------------------
  # cAdvisor (Container metrics)
  # ---------------------------------------------------------------------------
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'infrastructure'
          component: 'containers'

# -----------------------------------------------------------------------------
# Alerting Rules
# -----------------------------------------------------------------------------
rule_files:
  - 'rules/*.yml'

# -----------------------------------------------------------------------------
# Remote Write (for long-term storage, e.g., Grafana Cloud, Thanos)
